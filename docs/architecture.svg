<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>WiFi sensing pipeline architecture</title>
  <desc>Data flows from one of three interchangeable sources through signal conditioning and feature extraction into a detector, which gates its outputs by what the source and sample rate can physically support.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowLight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <style>
    .bg      { fill: #ffffff; }
    .band    { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; }
    .box     { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; }
    .boxAcc  { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.6; }
    .boxWarn { fill: #fef3f2; stroke: #f97066; stroke-width: 1.6; }
    .boxOk   { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.6; }
    .stage   { font-size: 11px; font-weight: 700; letter-spacing: .09em; fill: #64748b; text-transform: uppercase; }
    .title   { font-size: 13.5px; font-weight: 650; fill: #0f172a; }
    .sub     { font-size: 10.5px; fill: #64748b; }
    .mono    { font-size: 10px; fill: #475569; font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; }
    .flow    { stroke: #64748b; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .flowL   { stroke: #94a3b8; stroke-width: 1.2; fill: none; marker-end: url(#arrowLight); stroke-dasharray: 4 3; }
    .note    { font-size: 10px; fill: #f97066; font-style: italic; }
    .noteOk  { font-size: 10px; fill: #059669; font-style: italic; }
    .hdr     { font-size: 16px; font-weight: 700; fill: #0f172a; }
    .hdrSub  { font-size: 11px; fill: #64748b; }

    @media (prefers-color-scheme: dark) {
      .bg      { fill: #0b0f14; }
      .band    { fill: #111823; stroke: #1e293b; }
      .box     { fill: #131b26; stroke: #334155; }
      .boxAcc  { fill: #10233c; stroke: #3b82f6; }
      .boxWarn { fill: #2a1512; stroke: #f97066; }
      .boxOk   { fill: #0d2620; stroke: #10b981; }
      .title   { fill: #e2e8f0; }
      .stage, .sub, .hdrSub { fill: #94a3b8; }
      .mono    { fill: #cbd5e1; }
      .hdr     { fill: #f1f5f9; }
    }
  </style>

  <rect class="bg" width="980" height="620"/>

  <text class="hdr" x="34" y="36">WiFi CSI sensing pipeline</text>
  <text class="hdrSub" x="34" y="55">Sources are interchangeable behind one interface — adding hardware is a flag, not a rewrite</text>

  <!-- ============ SOURCES ============ -->
  <rect class="band" x="24" y="76" width="212" height="300" rx="10"/>
  <text class="stage" x="40" y="99">1 · Sources</text>

  <rect class="boxWarn" x="40" y="112" width="180" height="66" rx="7"/>
  <text class="title" x="54" y="132">Windows RSSI</text>
  <text class="mono"  x="54" y="148">netsh · WLAN API · 4 Hz</text>
  <text class="note"  x="54" y="167">static on MT7922 — rejected</text>

  <rect class="boxOk" x="40" y="190" width="180" height="66" rx="7"/>
  <text class="title" x="54" y="210">Recorded CSI</text>
  <text class="mono"  x="54" y="226">.csi.jsonl · 20 Hz · 64 sc</text>
  <text class="noteOk" x="54" y="245">real capture — validated</text>

  <rect class="box" x="40" y="268" width="180" height="66" rx="7"/>
  <text class="title" x="54" y="288">ESP32-S3 UDP</text>
  <text class="mono"  x="54" y="304">ADR-018 · port 5005</text>
  <text class="sub"   x="54" y="323">written, unverified</text>

  <text class="mono" x="40" y="358">one Sample interface</text>

  <!-- ============ DSP ============ -->
  <rect class="band" x="270" y="76" width="212" height="300" rx="10"/>
  <text class="stage" x="286" y="99">2 · Conditioning</text>

  <rect class="box" x="286" y="112" width="180" height="52" rx="7"/>
  <text class="title" x="300" y="132">Hampel filter</text>
  <text class="sub"   x="300" y="150">impulsive outliers → median</text>

  <rect class="box" x="286" y="176" width="180" height="52" rx="7"/>
  <text class="title" x="300" y="196">Detrend</text>
  <text class="sub"   x="300" y="214">removes AP power drift</text>

  <rect class="box" x="286" y="240" width="180" height="52" rx="7"/>
  <text class="title" x="300" y="260">Butterworth</text>
  <text class="sub"   x="300" y="278">zero-phase, filtfilt</text>

  <rect class="box" x="286" y="304" width="180" height="52" rx="7"/>
  <text class="title" x="300" y="324">Welch PSD</text>
  <text class="sub"   x="300" y="342">band power + Nyquist guard</text>

  <!-- ============ DETECTOR ============ -->
  <rect class="band" x="516" y="76" width="212" height="300" rx="10"/>
  <text class="stage" x="532" y="99">3 · Detection</text>

  <rect class="boxAcc" x="532" y="112" width="180" height="60" rx="7"/>
  <text class="title" x="546" y="132">Ambient baseline</text>
  <text class="sub"   x="546" y="150">learned with area empty</text>
  <text class="mono"  x="546" y="165">mean ± σ of dispersion</text>

  <rect class="box" x="532" y="184" width="180" height="52" rx="7"/>
  <text class="title" x="546" y="204">z-score</text>
  <text class="mono"  x="546" y="222">(σ_window − μ) / σ_ambient</text>

  <rect class="box" x="532" y="248" width="180" height="52" rx="7"/>
  <text class="title" x="546" y="268">Hysteresis</text>
  <text class="mono"  x="546" y="286">enter 3σ · exit 1.5σ</text>

  <rect class="box" x="532" y="312" width="180" height="52" rx="7"/>
  <text class="title" x="546" y="332">Debounce</text>
  <text class="sub"   x="546" y="350">N agreeing windows</text>

  <!-- ============ OUTPUT ============ -->
  <rect class="band" x="762" y="76" width="194" height="300" rx="10"/>
  <text class="stage" x="778" y="99">4 · Output</text>

  <rect class="box" x="778" y="112" width="162" height="52" rx="7"/>
  <text class="title" x="792" y="132">Dashboard</text>
  <text class="mono"  x="792" y="150">JSON · :8000</text>

  <rect class="box" x="778" y="176" width="162" height="52" rx="7"/>
  <text class="title" x="792" y="196">Figures + CSV</text>
  <text class="sub"   x="792" y="214">RESULTS.md</text>

  <rect class="boxAcc" x="778" y="240" width="162" height="116" rx="7"/>
  <text class="title" x="792" y="260">Capability gate</text>
  <text class="sub"   x="792" y="278">motion ✓   presence ✓</text>
  <text class="sub"   x="792" y="295">respiration — gated</text>
  <text class="sub"   x="792" y="312">heart rate — gated</text>
  <text class="sub"   x="792" y="329">pose ✕ no weights</text>
  <text class="mono"  x="792" y="348">refuses, never guesses</text>

  <!-- ============ FLOW ARROWS ============ -->
  <path class="flow" d="M 224 145 L 262 145 L 262 138 L 280 138"/>
  <path class="flow" d="M 224 223 L 262 223 L 262 202 L 280 202"/>
  <path class="flow" d="M 224 301 L 262 301 L 262 266 L 280 266"/>
  <path class="flow" d="M 470 226 L 524 226"/>
  <path class="flow" d="M 716 226 L 770 226"/>

  <!-- ============ WINDOWS PANEL ============ -->
  <rect class="band" x="24" y="404" width="458" height="186" rx="10"/>
  <text class="stage" x="40" y="427">Separate windows — one size cannot serve both</text>

  <rect class="box" x="40" y="440" width="200" height="72" rx="7"/>
  <text class="title" x="54" y="460">Motion · 4 s</text>
  <text class="sub"   x="54" y="478">short, to stay responsive</text>
  <text class="mono"  x="54" y="496">80 samples @ 20 Hz</text>

  <rect class="box" x="256" y="440" width="210" height="72" rx="7"/>
  <text class="title" x="270" y="460">Respiration · 30 s</text>
  <text class="sub"   x="270" y="478">resolution is fs/N</text>
  <text class="mono"  x="270" y="496">0.1 Hz needs one full cycle</text>

  <text class="sub" x="54" y="536">Respiration is estimated from the median of the top-K highest-variance</text>
  <text class="sub" x="54" y="552">subcarriers, not one. Single-subcarrier selection produced a factor-of-two</text>
  <text class="sub" x="54" y="568">subharmonic error between nodes (18.7 vs 9.3 br/min).</text>

  <!-- ============ VALIDATION PANEL ============ -->
  <rect class="band" x="516" y="404" width="440" height="186" rx="10"/>
  <text class="stage" x="532" y="427">Validation — plausibility is not evidence</text>

  <text class="sub" x="532" y="450">The respiratory band 0.1–0.5 Hz maps exactly onto 6–30 br/min, so</text>
  <text class="sub" x="532" y="466">any noise peak yields a physiologically plausible number.</text>

  <rect class="boxOk"   x="532" y="480" width="200" height="58" rx="7"/>
  <text class="title" x="546" y="500">Aligned pairing</text>
  <text class="mono"  x="546" y="518">r = +0.301</text>
  <text class="noteOk" x="546" y="532">shared signal supported</text>

  <rect class="boxWarn" x="746" y="480" width="194" height="58" rx="7"/>
  <text class="title" x="760" y="500">Shifted / shuffled</text>
  <text class="mono"  x="760" y="518">|r| ≤ 0.054</text>
  <text class="note"  x="760" y="532">collapses → control passes</text>

  <text class="sub" x="532" y="560">Median agreement is unchanged by shuffling, so it demonstrates nothing.</text>
  <text class="sub" x="532" y="576">Temporal correlation against decorrelated controls carries the evidence.</text>

  <path class="flowL" d="M 716 356 L 736 356 L 736 396"/>
</svg>
